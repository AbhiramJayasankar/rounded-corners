<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Geist:wght@400;500;600&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1280px;height:640px;overflow:hidden;background:#000;font-family:Geist,sans-serif;color:#fff}
/* light spilling from the screen onto the dark room */
body>*{translate:0 28px}
.glow{position:absolute;left:520px;top:40px;width:760px;height:560px;filter:blur(90px);opacity:.55;
  background:radial-gradient(45% 50% at 25% 30%,#f2b04a,transparent 70%),radial-gradient(40% 45% at 70% 65%,#a8561c,transparent 70%),radial-gradient(30% 35% at 85% 25%,#6b3a12,transparent 70%)}
.text{position:absolute;left:68px;top:118px;width:470px}
h1{font-family:Unbounded,sans-serif;font-weight:800;font-size:62px;line-height:1.02;letter-spacing:-1.5px;margin:0 0 26px}
.lede{font-size:22px;line-height:1.45;color:#c3c8d4;margin:0 0 34px}
.facts{display:grid;grid-template-columns:auto auto auto;gap:0 30px;width:max-content}
.facts b{display:block;font-family:Unbounded,sans-serif;font-weight:500;font-size:30px;letter-spacing:-.5px}
.facts span{font-size:15px;color:#8e95a3}
/* the display: black bezel, screen inside */
.device{position:absolute;left:600px;top:96px;width:620px;height:400px;border-radius:22px;background:#000;
  box-shadow:0 0 0 1px #24262c,0 30px 80px rgba(0,0,0,.8)}
.screen{position:absolute;left:14px;top:14px;right:14px;bottom:14px;overflow:hidden;
  background:#2a1a0e url(wallpaper.jpg) 56.8% 49.7%/140% auto no-repeat}
.win{position:absolute;border-radius:9px;background:rgba(20,22,40,.55);backdrop-filter:blur(14px);
  box-shadow:0 0 0 1px rgba(255,255,255,.14),0 16px 40px rgba(0,0,0,.35)}
.win i{position:absolute;left:14px;height:7px;border-radius:4px;background:rgba(255,255,255,.22)}
.w1{left:52px;top:48px;width:270px;height:200px}
.w2{left:300px;top:118px;width:250px;height:160px;background:rgba(240,242,255,.16)}
.task{position:absolute;left:0;right:0;bottom:0;height:34px;background:rgba(14,16,30,.72);backdrop-filter:blur(10px);
  display:flex;justify-content:center;align-items:center;gap:9px}
.task i{width:18px;height:18px;border-radius:5px;background:rgba(255,255,255,.28)}
.task i:nth-child(2){background:#4cc2ff}.task i:nth-child(3){background:#ffb84c}.task i:nth-child(4){background:#9b7bff}
/* the app's black corners (right half = after) */
.c{position:absolute;width:30px;height:30px}
.tl{left:14px;top:14px;background:radial-gradient(circle at 100% 100%,transparent 29.5px,#000 30.5px)}
.bl{left:14px;bottom:14px;background:radial-gradient(circle at 100% 0,transparent 29.5px,#000 30.5px)}
/* before / after split */
.split{position:absolute;left:910px;top:96px;width:2px;height:400px;background:rgba(255,255,255,.85)}
.knob{position:absolute;left:-15px;top:185px;width:32px;height:32px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.knob:before,.knob:after{content:"";position:absolute;top:11px;border:5px solid transparent}
.knob:before{left:3px;border-right-color:#222}.knob:after{right:3px;border-left-color:#222}
.tag{position:absolute;top:516px;font-size:15px;color:#8e95a3}
/* magnifier on the after corner */
#loupe{position:absolute;left:660px;top:150px;border-radius:50%;box-shadow:0 0 0 3px #fff,0 18px 50px rgba(0,0,0,.7)}
.cap{position:absolute;left:660px;top:354px;width:196px;text-align:center;font-size:13px;color:#e6e8ee;text-shadow:0 1px 6px rgba(0,0,0,.8)}
</style>
<div class="glow"></div>
<div class="text">
  <h1>Rounded Corners</h1>
  <p class="lede">Smooth, black, rounded screen corners for Windows 11 and 10. Made for OLED, where black is off.</p>
  <div class="facts">
    <div><b>18 KB</b><span>no installer</span></div>
    <div><b>2 MB</b><span>of memory</span></div>
    <div><b>0%</b><span>CPU when idle</span></div>
  </div>
</div>
<div class="device"><div class="screen">
  <div class="win w1"><i style="top:16px;width:90px"></i><i style="top:44px;width:200px"></i><i style="top:60px;width:170px"></i><i style="top:76px;width:190px"></i></div>
  <div class="win w2"><i style="top:16px;width:70px"></i><i style="top:44px;width:180px"></i><i style="top:60px;width:150px"></i></div>
  <div class="task"><i></i><i></i><i></i><i></i><i></i></div>
</div><div class="c tl"></div><div class="c bl"></div></div>
<div class="split"><div class="knob"></div></div>
<div class="tag" style="left:604px">With Rounded Corners</div>
<div class="tag" style="left:1100px">Without</div>
<canvas id="loupe" width="196" height="196"></canvas>
<div class="cap">Top-left corner, 14x</div>
<script src="corner.js"></script>
<script>
// a real 14 px corner, top-left, 14x, over the wallpaper colour at that corner
const r=14, z=14, a=cornerAlpha(r), c=loupe.getContext('2d'), bg=[188,133,73];
c.fillStyle='#000';c.fillRect(0,0,196,196);
for(let y=0;y<r;y++)for(let x=0;x<r;x++){
  const al=a[y][x]/255, col=bg.map(v=>Math.round(v*(1-al)));
  c.fillStyle=`rgb(${col})`;c.fillRect(x*z,y*z,z-1,z-1);
}
</script>
